name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Vet Code
        run: go vet ./...

      - name: Test Code
        run: go test -v ./...

      - name: Lint Code
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
