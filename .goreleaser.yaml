version: 2
project_name: smidhus-harness

before:
  hooks:
    - go mod tidy

builds:
  - id: smidhus-harness
    main: ./cmd/harness
    binary: smidhus-harness
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# ---------------------------------------------------
# AUTOMATED DISTRIBUTION (Homebrew & Scoop)
# ---------------------------------------------------
brews:
  - repository:
      owner: smidhus
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    name: harness
    directory: Formula
    description: "Deterministic CLI orchestrator for AI agents."
    homepage: "https://smidhus.dev"

scoops:
  - repository:
      owner: smidhus
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    name: harness
    directory: bucket
    description: "Deterministic CLI orchestrator for AI agents."
    homepage: "https://smidhus.dev"